[workspace]
resolver = "3"
exclude = ["vendor/yrs"]
# crates/silicon-present-client and crates/present-cli join this list once they exist.
members = ["crates/present-deck", "crates/present-service", "crates/silicon-present-client", "crates/present-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/teamofsilicons/silicon-present"
rust-version = "1.90"

[workspace.dependencies]
present-deck = { path = "crates/present-deck" }
yrs = "0.28.0"
silicon-accounts-client = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "macros", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures = "0.3.34"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream", "query"] }
tower-http = { version = "0.7.1", features = ["cors", "limit"] }
uuid = { version = "1.26.0", features = ["v4", "v7", "serde"] }
time = { version = "0.3.44", features = ["serde", "formatting", "parsing", "macros"] }
rand = "0.9.2"
base64 = "0.22.1"
dissimilar = "1.0.11"
thiserror = "2.0.17"
anyhow = "1.0.100"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
bs58 = "0.5.1"
bytes = "1.11.0"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "pem", "rand_core"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }

[profile.dev]
debug = 0

[patch.crates-io]
yrs = { path = "vendor/yrs" }
