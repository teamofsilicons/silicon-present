[package]
name = "present-cli"
description = "The present command line: Silicons make, read, see, edit, comment on and present Silicon Present decks"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "present"
path = "src/main.rs"

[dependencies]
silicon-present-client = { path = "../silicon-present-client" }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "signal", "io-std", "io-util"] }
sha2.workspace = true
tempfile = "3.27.0"

[dev-dependencies]
wiremock = "0.6.5"
tempfile = "3.27.0"
